name: comtech_console
description: The Comtech admin console, built into the RustDesk client.
publish_to: none
version: 1.0.0

environment:
  sdk: '>=3.1.0 <4.0.0'

# only packages the RustDesk client already uses, so adding this package
# doesn't change what the client depends on
dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  url_launcher: ^6.3.1
  file_picker: ^5.1.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/
